<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Harvey on v64</title>
<style>
html,body{margin:0;background:#111;color:#ddd;font:13px ui-monospace,monospace}
#screen{width:100vw;height:55vh;background:#000;overflow:hidden}
#screen>div{white-space:pre;font:14px monospace;line-height:14px}
#screen canvas{display:none}
#serial{white-space:pre-wrap;height:37vh;overflow:auto;background:#000;padding:8px;border-top:1px solid #333}
#cmdform{height:3vh;display:flex;background:#111}
#cmd{flex:1;background:#000;color:#ddd;border:1px solid #333;font:13px monospace;padding:2px 6px}
</style>
</head>
<body>
<div id="screen" tabindex="0"><div></div><canvas></canvas></div>
<div id="serial"></div>
<form id="cmdform"><input id="cmd" autocomplete="off" placeholder="guest serial input (Enter)" autofocus></form>
<script type="module">
import { V86 } from "../v64/lib/libv86.mjs";
import { NineP2000 } from "../extras/harvey/js9p2000.js";

const p9 = new NineP2000();
for (const f of ["boot/boot", "boot/init", "bin/rc", "bin/echo", "bin/test", "bin/ls", "bin/cat", "rc/lib/rcmain"]) {
  try {
    const r = await fetch("../local/harvey/rootfs/" + f);
    if (r.ok) p9.addFile(f, await r.arrayBuffer());
    else console.warn("missing root file", f, r.status);
  } catch (e) { console.warn("root file", f, e); }
}

const serial = document.getElementById("serial");
const log = (s) => { serial.textContent += s; };
window.addEventListener("error", (e) => log("\n[pageerror] " + e.message + "\n"));

// Harvey is a long-mode x86_64 kernel.  v64 is the browser runtime that
// exposes the x86_64 CPU profile; the old 32-bit v86 runtime cannot boot it.
const vm = new V86({
  wasm_path: "../v64/lib/v86.wasm",
  graphics_adapter: "bochs_vga",
  cpu_type: "x86_64",
  acpi: true,
  memory_size: 512 * 1024 * 1024,
  bios: { url: "../v64/bios/seabios.bin" },
  vga_bios: { url: "../v64/bios/vgabios.bin" },
  multiboot: { url: "../local/harvey/harvey.32bit" },
  cmdline: "bootargs=local!#9/0 nobootprompt=local",
  filesystem: { handle9p: (req, reply) => p9.handle(req, reply) },
  net_device: { type: "virtio" },
  screen_container: document.getElementById("screen"),
  autostart: true,
  disable_speaker: true,
});
window.emulator = vm;
for (const ev of ["emulator-ready", "emulator-loaded", "emulator-started", "emulator-stopped", "emulator-error"]) {
  vm.add_listener(ev, (x) => log("\n[" + ev + "]" + (x && x.message ? " " + x.message : "") + "\n"));
}
vm.add_listener("serial0-output-byte", (b) => log(String.fromCharCode(b)));
const form = document.getElementById("cmdform");
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const input = document.getElementById("cmd");
  vm.serial_send_bytes("0", new TextEncoder().encode(input.value + "\n"));
  input.value = "";
});
</script>
</body>
</html>
