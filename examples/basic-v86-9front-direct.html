                const alphabet = "abcdefghijklmnopqrstuvwxyz234567";
                let bits = 0, value = 0, output = "";
                for (let i = 0; i < bytes.length; i++) {
                    value = (value << 8) | bytes[i];
                    bits += 8;
                    while (bits >= 5) {
                        output += alphabet[(value >>> (bits - 5)) & 31];
                        bits -= 5;
                    }
                }
                if (bits > 0) {
                    output += alphabet[(value << (5 - bits)) & 31];
                }
                return output;
            }
        }

        function pickViaInput() {
            return new Promise((resolve, reject) => {
                const input = document.createElement("input");
                input.type = "file";
                input.style.display = "none";
                input.onchange = () => {
                    const f = input.files && input.files[0];
                    if (f) {
                        resolve(f);
                    } else {
                        reject(new Error("no file selected"));
                    }
                    input.remove();
                };
                document.body.appendChild(input);
                input.click();
            });
        }

        function downloadBlob(name, data) {
            const blob = new Blob([data], { type: "application/octet-stream" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = name;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
        }

        async function startSecureBinService(root) {
            const pubHex = "077eb554631807aaea4ebf925c82eb900223fa67f3288c10cc474c8d8821fabc";
            const pubBytes = new Uint8Array(pubHex.match(/../g).map(h => parseInt(h, 16)));

            function b64urlDecode(str) {
                str = str.replace(/-/g, "+").replace(/_/g, "/");
                while (str.length % 4) str += "=";
                const binary = atob(str);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return bytes;
            }

            function bytesToHex(buf) {
                return Array.from(new Uint8Array(buf))
                    .map(b => b.toString(16).padStart(2, "0"))
                    .join("");
            }

            try {
                await ignoreExists(() => root.makeDirAll("bin"));
                await ignoreExists(() => ensureFile(root, "bin/STATUS", "VERIFYING\n"));
                await ignoreExists(() => ensureFile(root, "bin/ctl", ""));
                await ignoreExists(() => ensureFile(root, "bin/status", "verifying libtab\n"));

                // 1. Fetch bin.tab
                const tabResp = await fetch("/extras/9legacy/bin.tab", { cache: "no-store" });
                if (!tabResp.ok) {
                    throw new Error(`Failed to fetch bin.tab: ${tabResp.status} ${tabResp.statusText}`);
                }
                const tabText = await tabResp.text();

                // 2. Import Ed25519 public key
                const cryptoKey = await crypto.subtle.importKey(
                    "raw",
                    pubBytes,
                    { name: "Ed25519" },
                    false,
                    ["verify"]
                );

                // 3. Parse and verify each tuple in bin.tab
                const manifest = new Map(); // path -> { size, sha256 }
                const tuples = tabText.split(/\n\s*\n/);
                let verifiedCount = 0;

                for (const tuple of tuples) {
                    const trimmed = tuple.trim();
                    if (!trimmed || trimmed.startsWith("#") || trimmed.includes("schema=binaries")) {
                        continue;
                    }
                    const pathMatch = trimmed.match(/^path=([^\s\n]+)/m);
                    const sizeMatch = trimmed.match(/^\s*size=(\d+)/m);
                    const shaMatch = trimmed.match(/^\s*sha256=([a-fA-F0-9]{64})/m);
                    const attestMatch = trimmed.match(/^\s*attest=signed:([^:]+):([^\s\n]+)/m);

                    if (!pathMatch || !sizeMatch || !shaMatch || !attestMatch) {
                        throw new Error(`Malformed libtab tuple: ${trimmed.slice(0, 50)}...`);
                    }

                    const path = pathMatch[1];
                    const size = parseInt(sizeMatch[1], 10);
                    const sha256 = shaMatch[1].toLowerCase();
                    const bodyB64 = attestMatch[1];
                    const sigB64 = attestMatch[2];

                    const bodyBytes = b64urlDecode(bodyB64);
                    const sigBytes = b64urlDecode(sigB64);

                    const expectedBody = `path=${path} size=${size} sha256=${sha256}`;
                    const actualBody = dec.decode(bodyBytes);
                    if (actualBody !== expectedBody) {
                        throw new Error(`Body mismatch for ${path}: expected "${expectedBody}", got "${actualBody}"`);
                    }

                    const ok = await crypto.subtle.verify({ name: "Ed25519" }, cryptoKey, sigBytes, bodyBytes);
                    if (!ok) {
                        throw new Error(`Ed25519 signature invalid for ${path}`);
                    }

                    manifest.set(path, { size, sha256 });
                    verifiedCount++;
                }

                // 4. Mark status as VERIFIED
                const statusMsg = `VERIFIED: ${verifiedCount} binaries (signer=halatha-root, algo=Ed25519)\n`;
                await writeText(root, "bin/STATUS", statusMsg);
                await writeText(root, "bin/bin.tab", tabText);
                await writeText(root, "bin/status", "ready\n");
                console.log(`[Wanix libtab] ${statusMsg.trim()}`);

                // Helper to install & verify a single binary
                async function installBinary(relPath) {
                    const entry = manifest.get(relPath);
                    if (!entry) {
                        throw new Error(`Unknown binary: ${relPath}`);
                    }
                    const resp = await fetch(`/extras/9legacy/bin/${relPath}`, { cache: "no-store" });
                    if (!resp.ok) {
                        throw new Error(`Fetch failed for ${relPath}: ${resp.status}`);
                    }
                    const data = new Uint8Array(await resp.arrayBuffer());
                    if (data.length !== entry.size) {
                        throw new Error(`Size mismatch for ${relPath}: expected ${entry.size}, got ${data.length}`);
                    }
                    const hashBuf = await crypto.subtle.digest("SHA-256", data);
                    const hashHex = bytesToHex(hashBuf).toLowerCase();
                    if (hashHex !== entry.sha256) {
                        throw new Error(`SHA256 mismatch for ${relPath}: expected ${entry.sha256}, got ${hashHex}`);
                    }

                    const slashIdx = relPath.lastIndexOf("/");
                    if (slashIdx !== -1) {
                        const parentDir = relPath.substring(0, slashIdx);
                        await ignoreExists(() => root.makeDirAll("bin/" + parentDir));
                    }
                    await root.writeFile("bin/" + relPath, data);
                    await ignoreExists(() => root.chmod("bin/" + relPath, 0o755));
                    return data.length;
                }

                // 5. Preload core binaries so they are immediately available
                const preloadList = [
                    "cmp", // clipboard worker; omitted from the lean image
                    "diff",
                    "troff",
                    "tar",
                    "gzip",
                    "awk",
                    "snoopy",
                    "ip/ping",
                    "games/sokoban"
                ];

                for (const p of preloadList) {
                    try {
                        if (manifest.has(p)) {
                            await installBinary(p);
                            console.log(`[Wanix libtab] Preloaded and verified: ${p}`);
                        }
                    } catch (err) {
                        console.warn(`[Wanix libtab] Failed to preload ${p}:`, err);
                    }
                }

                // 6. Listen on bin/ctl for on-demand installation requests
                let lastCtl = "";
                setInterval(async () => {
                    try {
                        const ctl = (await readText(root, "bin/ctl")).trim();
                        if (!ctl || ctl === lastCtl) return;
                        lastCtl = ctl;

                        if (ctl.startsWith("install ")) {
                            const target = ctl.slice(8).trim();
                            if (target === "all") {
                                await writeText(root, "bin/status", `installing all ${manifest.size} binaries\n`);
                                // NOTE: this HTTP path is superseded by the
                                // 9P mount of the attested tree (fs/libtabfs,
                                // `wanix serve --libtab-dir`), where the guest
                                // demand-pages what it executes instead of
                                // pulling ~114 MB through the browser. It is
                                // kept as the fallback for static hosting,
                                // where there is no wanix server to mount.
                                //
                                // Fetch concurrently. This was a sequential
                                // await per binary: at ~0.5s round trip that
                                // is ~7 minutes for 803 files, so the guest's
                                // `pkg install all` timed out long before the
                                // browser finished and only the handful that
                                // had landed by then showed up in /n/host/bin.
                                // The work is network-bound, so a modest pool
                                // is the whole fix; 8 keeps us well inside the
                                // browser's per-host connection limit.
                                const paths = [...manifest.keys()];
                                const CONCURRENCY = 8;
                                let count = 0, failed = 0, next = 0;
                                async function worker() {
                                    for (;;) {
                                        const i = next++;
                                        if (i >= paths.length) return;
                                        try {
                                            await installBinary(paths[i]);
                                            count++;
                                        } catch (e) {
                                            failed++;
                                            console.error(`Error installing ${paths[i]}:`, e);
                                        }
                                        if ((count + failed) % 25 === 0) {
                                            await writeText(root, "bin/status",
                                                `installing ${count + failed}/${paths.length}\n`);
                                        }
                                    }
                                }
                                await Promise.all(
                                    Array.from({length: Math.min(CONCURRENCY, paths.length)}, worker));
                                await writeText(root, "bin/status",
                                    failed
                                        ? `installed ${count} binaries, ${failed} failed\n`
                                        : `installed all (${count} binaries)\n`);
                            } else {
                                let matched = null;
                                if (manifest.has(target)) {
                                    matched = target;
                                } else {
                                    for (const [p] of manifest) {
                                        if (p === target || p.endsWith("/" + target)) {
                                            matched = p;
                                            break;
                                        }
                                    }
                                }

                                if (!matched) {
                                    await writeText(root, "bin/status", `error unknown package ${target}\n`);
                                } else {
                                    await writeText(root, "bin/status", `installing ${matched}\n`);
                                    try {
                                        await installBinary(matched);
                                        await writeText(root, "bin/status", `installed ${matched}\n`);
                                    } catch (e) {
                                        await writeText(root, "bin/status", `error ${e.message || e}\n`);
                                    }
                                }
                            }
                            await writeText(root, "bin/ctl", "");
                            lastCtl = "";
                        }
                    } catch (_) {}
                }, 500);

            } catch (err) {
                console.error("[Wanix libtab] Verification failed:", err);
                await writeText(root, "bin/STATUS", `REJECTED: ${err.message || err}\n`);
                await writeText(root, "bin/status", `error verification failed: ${err.message || err}\n`);
            }
        }

        async function ensureTree(root) {
            for (const dir of ["boot", "clip", "downloads", "fetch", "net", "uploads", "app", "ipfs", "ipfs/out", "bin"]) {
                await ignoreExists(() => root.makeDirAll(dir));
            }
            await ignoreExists(() => writeText(root, "READY", "READY\n"));
            await seedHostBootScripts(root);
            await ignoreExists(() => ensureFile(root, "boot/guest.log", ""));
            await ignoreExists(() => ensureFile(root, "boot/probe.log", ""));
            await ignoreExists(() => ensureFile(root, "boot/status", "waiting for guest telemetry\n"));
            await ignoreExists(() => ensureFile(root, "clip/text", ""));
            await ignoreExists(() => ensureFile(root, "fetch/ctl", ""));
            await ignoreExists(() => writeText(root, "fetch/body", "write a URL to fetch/ctl\n"));
            await ignoreExists(() => writeText(root, "net/status", [
                "wanix direct host9p up",
                `v86 net ${netMode}`,
                `disk chunk ${diskChunkSize}`,
                `relay ${relayURL || "none"}`,
                typeof fetch === "function" ? "fetch available" : "fetch unavailable",
                "",
            ].join("\n")));
            await ignoreExists(() => ensureFile(root, "uploads/upload.txt", "uploaded through wanix direct service\n"));
            await ignoreExists(() => ensureFile(root, "app/ctl", ""));
            // File System Access picker triggers. The guest writes a command
            // to the ctl file (halctl write <ctl> <cmd>); startFsaService polls
            // it and opens the browser file picker. See startFsaService.
            await ignoreExists(() => ensureFile(root, "uploads/ctl", ""));
            await ignoreExists(() => ensureFile(root, "uploads/name", ""));
            await ignoreExists(() => ensureFile(root, "uploads/in", ""));
            await ignoreExists(() => ensureFile(root, "downloads/ctl", ""));
            await ignoreExists(() => ensureFile(root, "ipfs/ctl", ""));
            await ignoreExists(() => ensureFile(root, "ipfs/in", ""));
            await ignoreExists(() => ensureFile(root, "ipfs/status", "idle\n"));
            await ignoreExists(() => ensureFile(root, "ipfs/cid", ""));
            await ignoreExists(() => ensureFile(root, "bin/ctl", ""));
            await ignoreExists(() => ensureFile(root, "bin/status", "ready\n"));
            await ignoreExists(() => ensureFile(root, "bin/STATUS", "initializing\n"));
        }

        async function seedHostBootScripts(root) {
            // The babyfs dial string is installed by the deployment and is
            // deliberately outside the release bundle. Publish it before
            // seed-ready so both guest clients see the same current value.
            const endpointPromise = (async () => {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 8000);
                try {
                    const response = await fetch("/config/babyfs-endpoint", {
                        cache: "no-store", signal: controller.signal,
                    });
                    if (!response.ok) return null;
                    const endpoint = (await response.text()).trim();
                    return endpoint.length < 256 && /^tcp![^!\s]+!\d+$/.test(endpoint)
                        ? endpoint : null;
                } catch (_) {
                    return null;
                } finally {
                    clearTimeout(timer);
                }
            })();
            const scripts = [
                ["extras/9front/halatha.local", "boot/halatha.local"],
                ["extras/9front/desktop.rc", "boot/desktop.rc"],
                ["extras/9front/o9build.rc", "boot/o9build.rc"],
                ["extras/9front/ygg-up.rc", "boot/ygg-up.rc"],
                ["extras/9front/ygg-peers.rc", "boot/ygg-peers.rc"],
                ["extras/9front/yggdrasil.peers", "boot/yggdrasil.peers"],
                ["extras/9front/keyrequest.rc", "boot/keyrequest.rc"],
                ["extras/halatha/keyrequest/keyrequest.o9", "boot/keyrequest.o9"],
                ["extras/halatha/keyrequest/client.o9", "boot/keyrequest-client.o9"],
                ["extras/halatha/keyrequest/publickeys.o9", "boot/keyrequest-publickeys.o9"],
                ["extras/halatha/keyrequest/keyrequest.386", "boot/keyrequest.386", true],
                ["extras/9front/ipfs.rc", "boot/ipfs.rc"],
                ["extras/9front/clip.rc", "boot/clip.rc"],
                ["extras/halatha/clip.o9", "boot/clip.o9"],
                ["extras/9front/pkg.rc", "boot/pkg.rc"],
                ["extras/9front/hostbin.rc", "boot/hostbin.rc"],
            ];
            // Fetch independently so one slow asset cannot hold every later
            // boot script behind it. Publish to the 9P namespace in order,
            // then write seed-ready only after all results are accounted for.
            const fetched = await Promise.all(scripts.map(async ([src, dst, binary]) => {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 8000);
                try {
                    const response = await fetch(`/${src}`, {
                        cache: "no-store", signal: controller.signal,
                    });
                    if (!response.ok) {
                        throw new Error(`${response.status} ${response.statusText}`);
                    }
                    return { dst, binary, data: binary
                        ? new Uint8Array(await response.arrayBuffer())
                        : await response.text() };
                } catch (err) {
                    console.warn(`seed ${dst}:`, err);
                    return { dst, error: err };
                } finally {
                    clearTimeout(timer);
                }
            }));
            for (const file of fetched) {
                if (file.error) continue;
                try {
                    if (file.binary) await root.writeFile(file.dst, file.data);
                    else await writeText(root, file.dst, file.data);
                }
                catch (err) { console.warn(`seed ${file.dst}:`, err); }
            }
            try {
                const timezone = plan9Timezone();
                await writeText(root, "boot/timezone", timezone.text);
                await writeText(root, "boot/timezone-name", `${timezone.zone}\n`);
                await writeText(root, "boot/timezone-status", timezone.fixed
                    ? "current browser offset only\n" : "browser timezone with transitions\n");
            } catch (err) {
                console.warn("seed browser timezone:", err);
                await writeText(root, "boot/timezone-status", `error ${err.message || err}\n`);
            }
            const endpoint = await endpointPromise;
            if (endpoint) await writeText(root, "boot/babyfs-endpoint", `${endpoint}\n`);
            await writeText(root, "boot/babyfs-config-status", endpoint ? "ready\n" : "missing\n");
            await writeText(root, "boot/README", [
                "Halatha host boot files",
                "",
                "These files are served by the browser host namespace and appear in the guest as /n/host/boot.",
                "They are refreshed from extras/9front on each page load, so service-script changes do not require rebuilding the disk image.",
                "",
                "Manual smoke commands inside the guest:",
                "  rc /n/host/boot/ygg-up.rc",
                "  cat /tmp/ygg-start.log",
                "  yggdrasilctl getSelf",
                "",
                "The 9front boot hook starts the current /n/host/boot/halatha.local after seed-ready appears.",
                "The user profile reads boot/timezone before starting Rio.",
                "",
            ].join("\n"));
            await writeText(root, "boot/seed-ready", "ready\n");
        }

        async function ensureFile(root, path, text) {
            try {
                await root.stat(path);
            } catch (_) {
                await writeText(root, path, text);
            }
        }

        async function runFetch(root, url) {
            status.textContent = `host fetch ${url}`;
            try {
                const response = await fetch(url);
                const body = await response.text();
                await writeText(root, "fetch/body", [
                    `HTTP ${response.status} ${response.statusText}`,
                    `URL ${response.url}`,
                    "",
                    body,
                ].join("\n"));
            } catch (err) {
                await writeText(root, "fetch/body", `fetch failed: ${err.message || err}\n`);
            }
            status.textContent = "host namespace ready";
        }

        async function exposeDownloads(root, exported) {
            let entries = [];
            try {
                entries = await root.readDir("downloads");
            } catch (_) {
                return;
            }
            // readDir returns a Go []string; an empty dir is a nil slice which
            // marshals to JS `null`, so guard before iterating.
            if (!Array.isArray(entries)) {
                return;
            }
            for (const entry of entries) {
                if (entry === "ctl" || entry.endsWith("/") || exported.has(entry)) {
                    continue;
                }
                const data = await root.readFile(`downloads/${entry}`);
                exported.add(entry);
                const blob = new Blob([data], { type: "application/octet-stream" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = entry;
                link.textContent = `${entry} (${(data.length / 1024).toFixed(1)} KiB)`;
                downloads.appendChild(link);
            }
        }

        async function readText(root, path) {
            return dec.decode(await root.readFile(path));
        }

        async function writeText(root, path, text) {
            await root.writeFile(path, enc.encode(text));
        }

        function parseSizeParam(value, fallback) {
            if (!value) {
                return fallback;
            }
            const match = String(value).trim().match(/^(\d+)([kKmM]?)$/);
            if (!match) {
                return fallback;
            }
            const n = Number(match[1]);
            const suffix = match[2].toLowerCase();
            const scale = suffix === "m" ? 1024 * 1024 : suffix === "k" ? 1024 : 1;
            const bytes = n * scale;
            return bytes > 0 ? bytes : fallback;
        }

        function parseBootOrder(boot) {
            if (/^0x[0-9a-f]+$/i.test(boot || "")) return Number.parseInt(boot, 16);
            if (/^[0-9]+$/.test(boot || "")) return Number.parseInt(boot, 10);
            switch ((boot || "")[0]) {
                case "a":
                case "b": return 0x321;
                case "c": return 0x312;
                case "d": return 0x123;
                case "n": return 0x124;
                default: return 0x123;
            }
        }

        async function maybeWriteClipboard(text) {
            try {
                if (!navigator.clipboard || typeof navigator.clipboard.writeText !== "function") return false;
                await navigator.clipboard.writeText(text);
                return true;
            } catch (_) {
                // Browsers can reject clipboard writes without a direct gesture.
                return false;
            }
        }

        async function ignoreExists(fn) {
            try {
                await fn();
            } catch (_) {}
        }

    </script>
</body>
