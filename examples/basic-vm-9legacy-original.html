<html>
<head>
    <title>basic-vm-9legacy-original</title>
    <script type="module" src="/dist/wanix.min.js?v=screen-handshake"></script>
    <style>
        html,
        body,
        wanix-namespace,
        wanix-vm {
            display: block;
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
        }
    </style>
</head>
<body>

    <wanix-namespace id="legacy-original" allow-origins="*" debug>
        <wanix-bind dst="." src="#ramfs/new"></wanix-bind>

        <wanix-bind dst="#vm/v86" type="archive"
            src="/extras/dist/v86.tgz?v=final-screen">
        </wanix-bind>

        <wanix-vm id="vm"
            hda="/local/9legacy-copysh.img?v=original-control-1"
            boot="c" mem="512M"
            screen start
            style="width: 100%; height: 100%;"></wanix-vm>
    </wanix-namespace>

</body>
</html>
