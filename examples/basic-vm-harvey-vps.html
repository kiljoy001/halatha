<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Harvey desktop</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#ccc;font:13px ui-monospace,monospace}
wanix-vm{display:block;width:100vw;height:100vh;background:#000}
#status{position:fixed;left:0;right:0;bottom:28px;text-align:center;font:14px ui-monospace,monospace;color:#ddd;text-shadow:0 1px 3px #000;pointer-events:none;padding:0 16px}
#status.error{color:#f88}
</style>
</head>
<body>
<!--
  Harvey boots from an immutable GEFS image plus a browser-local namespace:

      initrd      GEFS image, loaded by v86 as a multiboot module. The guest
                  maps it writable, so GEFS writes stay in RAM and the image
                  file is never modified.
      ram/        browser-local ramfs (home, tmp, var, n)
      host/       browser-local service tree (clip, uploads, downloads, usb)

  The kernel boots with gefsroot=1, runs the embedded /boot/gefsinit, starts
  GEFS on /dev/initrd, pivots / to it, mounts the task namespace at /vps, and
  binds ram/ over the writable branches. The guest keeps no state on the
  server; files leave through the browser's save picker/download or WebUSB.

  The images are fetched here, on the page thread, and handed to v86 as blob
  URLs. v86's own loader reads module images with an XHR inside the worker
  while the wasm/JIT is coming up; on a WAN that drops a 256 MB module from
  ~10 s to several minutes. A blob URL is already in browser memory, so the
  worker only copies it into guest RAM.

  The server is only an image host: the guest namespace is the Wanix task
  namespace with browser ramfs bound at ram/ and host/. No session token or
  server-side data plane is involved.
-->
<div id="app"></div>
<div id="status">Loading the desktop…</div>
<script type="module">
const statusEl = document.querySelector("#status");
const setStatus = (text, isError = false) => {
  statusEl.textContent = text;
  statusEl.classList.toggle("error", isError);
};
const deployed = location.pathname === "/" || location.pathname === "/index.html";
const assetBase = deployed ? "/vps-test/" : "../";
// v86 selects its Wisp adapter from the wisps:// (or wisp://) scheme;
// passing wss:// here silently selects a different backend. The relay is
// stateless and tokenless and is expected to run next to the browser; a
// ?relay= override points the page at a local one.
const relayOverride = new URLSearchParams(location.search).get("relay");
const netBase = relayOverride || (deployed
  ? `wisps://${location.host}/vps-net`
  : "wisp://127.0.0.1:8099/net");

// Bump when the image changes. The server marks these immutable so a reload
// reads them from the browser cache instead of the WAN.
const IMAGE_VERSION = "20261101-2";
const KERNEL_VERSION = "20261101-13";
const gefsPath = `local/aspera/aspera-vps.gefs?v=${IMAGE_VERSION}`;
const kernelPath = `local/aspera/harvey-vps.32bit?v=${KERNEL_VERSION}`;

// Fetch an image with progress and turn it into a blob URL for v86.
async function preload(path, label) {
  const resp = await fetch(assetBase + path, { cache: "default" });
  if (!resp.ok) throw new Error(`${path}: HTTP ${resp.status}`);
  const total = Number(resp.headers.get("content-length")) || 0;
  const chunks = [];
  let loaded = 0;
  if (resp.body) {
    const reader = resp.body.getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      loaded += value.byteLength;
      if (total) {
        setStatus(`Loading ${label}… ${Math.round(100 * loaded / total)}%`);
      }
    }
  } else {
    const buf = await resp.arrayBuffer();
    chunks.push(new Uint8Array(buf));
    loaded = buf.byteLength;
  }
  const blob = new Blob(chunks, { type: "application/octet-stream" });
  chunks.length = 0;
  const url = URL.createObjectURL(blob);
  console.log(`vps: preloaded ${label} (${loaded} bytes)`);
  return url;
}

setStatus("Loading the desktop…");
let initrdURL = `${assetBase}${gefsPath}`;
let kernelURL = `${assetBase}${kernelPath}`;
try {
  initrdURL = await preload(gefsPath, "desktop image");
  kernelURL = await preload(kernelPath, "kernel");
} catch (err) {
  // Fall back to v86's own loader; correct, just much slower over the WAN.
  console.warn("vps: image preload failed, falling back to direct URLs:", err);
  setStatus("Could not preload images; falling back to the slow loader…");
}

document.querySelector("#app").innerHTML = `
<wanix-namespace id="ns">
  <wanix-bind dst="#vm/v86" src="${assetBase}v86/v86.tgz?v=v64-vps3" type="archive"></wanix-bind>
  <wanix-vm id="harvey"
      multiboot="${kernelURL}"
      initrd="${initrdURL}"
      cpu="x86_64"
      acpi
      netdev="ne2k"
      mem="1G"
      screen start
      relay="${netBase}"
      append="bootargs=local!#9/0 nobootprompt=local gefsroot=1"
      style="width:100%;height:100%">
    <!-- Everything the guest writes lives in browser memory; the server is
         only the image host. The guest mounts this task namespace at /vps
         and binds ram/ and host/ into /home, /tmp, /var and /n/host. -->
    <wanix-bind dst="ram" src="#ramfs/new"></wanix-bind>
    <wanix-bind dst="host" src="#ramfs/new"></wanix-bind>
  </wanix-vm>
</wanix-namespace>`;

try {
  await import(assetBase + "dist/wanix.js");
} catch (err) {
  setStatus(`Could not load the Wanix runtime: ${err.message || err}`, true);
  throw err;
}
const { startVPServices } = await import(assetBase + "extras/halatha/vps-services.js");

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const started = Date.now();
setStatus("Starting Harvey — the first boot can take a few minutes…");
const vm = document.querySelector("#harvey");

// The guest writes host/ready after it binds /n/host, before Rio starts.
// Waiting for that marker keeps the service pollers from competing with the
// boot-time 9P traffic.
const dec = new TextDecoder();
for (let i = 0; i < 600; i++) {
  const root = vm.task && vm.task.taskRoot;
  if (root) {
    try {
      if (dec.decode(await root.readFile("host/ready")).trim() === "ready") {
        setStatus("Guest ready");
        setTimeout(() => statusEl.remove(), 1500);
        startVPServices(root, { status: (m) => console.log("vps:", m) });
        break;
      }
    } catch (_) {}
  }
  if (i % 5 === 0) {
    const secs = Math.round((Date.now() - started) / 1000);
    setStatus(`Starting Harvey — the first boot can take a few minutes… (${secs}s)`);
  }
  await sleep(1000);
}
</script>
</body>
</html>
